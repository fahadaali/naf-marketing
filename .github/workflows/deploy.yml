name: نشر يدوي

# مسار نشرٍ احتياطي — لا بديلٌ عن Workers Builds.
#
# النشر المعتاد في هذا المستودع من وصلة Cloudflare Workers Builds: تبني
# عند الدفع إلى `main` بلا سيرٍ هنا. وهذا الملف لا يعمل عند الدفع إطلاقاً
# (`workflow_dispatch` وحده)، فلا بناءان يتسابقان على نفس العامل.
#
# وسببُ وجوده أن البناء هناك يقف أحياناً: بناءٌ واحد لكل عامل في كل مرّة،
# فمعلَّقٌ لا ينتهي يحجز الطابور خلفه، ويبقى المنشور ما قبل الدمج بلا أثرٍ
# ظاهر في المستودع. فيُشغَّل هذا يدوياً من تبويب Actions ويصل التغيير.
#
# وكان مكتوباً هنا أن هذا السير وحده يطبّق الهجرات «وWorkers Builds لا
# تفعل: أمرُها `npm run deploy` وحده، والهجرات نصٌّ منفصل». وكان صحيحاً
# ووصفَ عيباً في المسار الآليّ لا ميزةً في هذا: كلُّ تغييرٍ في المخطّط
# كان لغماً ينتظر من ينشر بلا أن يقرأ README.
#
# فصار `npm run deploy` نفسه يطبّق الهجرات قبل `wrangler deploy`، وهو
# أمرُ Workers Builds — فتمرّ الهجرات في كل نشرة بأوراق اعتماد كلاودفلير
# نفسها، بلا سرٍّ في GitHub ولا خطوةٍ يتذكّرها إنسان.
#
# وتبقى خطوة الهجرات أدناه صريحةً: `d1 migrations apply` لا يطبّق إلا ما
# لم يُطبَّق، فتكرارها لا يفعل شيئاً — ووجودها يجعل هذا المسار كاملاً
# بذاته حين يكون هو المستعمَل.
#
# ولأنه لا يمرّ عبر كلاودفلير، يحتاج وحده سرَّين في إعدادات المستودع
# (Settings ← Secrets and variables ← Actions): `CLOUDFLARE_API_TOKEN`
# بصلاحية تحرير العوامل وD1، و`CLOUDFLARE_ACCOUNT_ID`.

on:
  workflow_dispatch:

concurrency:
  group: deploy-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: البناء والهجرات والنشر
    runs-on: ubuntu-latest
    steps:
      # السرّان يُفحصان أوّلاً لا في الخطوة الثامنة: الفشل عليهما بعد
      # التركيب والفحص والاختبار والبناء يهدر الدقيقة، ويخرج برسالة
      # wrangler الإنجليزية التي لا تقول أين يُضبطان. وقع فعلاً في أول
      # تشغيلٍ بلغ الهجرات، فصار الفحص هنا.
      - name: التحقّق من سرَّي كلاودفلير
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::سرٌّ ناقص:$missing — يُضبط من Settings ← Secrets and variables ← Actions (أسرار المستودع). والتوكن يحتاج صلاحية تحرير العوامل وقواعد D1."
            echo "::notice::وإن كان مضبوطاً فعلاً فانظر أين: سرُّ بيئة (Environment) لا تراه المهمة إلا بـ`environment:` فيها، وسرُّ Dependabot أو Codespaces مخزنٌ آخر لا تقرؤه Actions. وأسرارُ كلاودفلير في لوحتها ليست أسرار GitHub — والنشر المعتاد يمرّ من هناك لا من هنا، فقد لا يكون هذا السير محتاجاً أصلاً."
            exit 1
          fi
          echo "السرّان موجودان."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # ملفّا قفل لا واحد — وإلا بُني مفتاح الكاش من قفل الجذر وحده،
          # فيبقى كاش الواجهة على حاله بعد تغيّر تبعياتها.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # npm يسجّل تبعيات github في ملف القفل بصيغة git+ssh مهما كُتبت،
      # ولا مفتاح SSH في المشغّل — فيفشل `npm ci` عند `naf-auth`. الخطوة
      # نفسها في `release.yml` حرفياً، وسببها هناك مشروحٌ بالتفصيل.
      # ومرّ التشغيل الأول بلا هذه الخطوة لأن كاش npm حمل الحزمة، وتغيّر
      # مفتاح الكاش أعلاه يُسقط ذلك الحظّ.
      - name: جلب تبعيات ناف الداخلية عبر HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - run: npm ci

      # الواجهة حزمة منفصلة بملف قفلها، ولا workspaces في الجذر — فـ
      # `npm ci` أعلاه لا يمسّها. و`npm run typecheck` يشمل
      # `npm --prefix web run typecheck`، فبلا هذه الخطوة يسقط على
      # «Cannot find module 'react'» قبل أن يبلغ سطراً من شيفرتنا.
      #
      # وكان يسقط فعلاً: هذا السير لم يُشغَّل قطّ منذ كُتب — `release.yml`
      # لا يفحص أنواعاً ولا يشغّل اختباراً — فبقي العيب كامناً حتى أول
      # تشغيل. و`npm run build` أدناه يركّبها أيضاً، لكنه بعد الفحص لا
      # قبله، فلا ينفع.
      - name: تركيب حزم الواجهة
        run: npm --prefix web ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: الاختبارات
        run: npm test

      # يبني واجهة React إلى `web/dist` — يخدمها العامل نفسه عبر ASSETS
      - name: البناء
        run: npm run build

      # قبل النشر لا بعده: عاملٌ جديد يقرأ جدولاً لم يُنشأ بعد يردّ ٥٠٠
      # على أول طلب، والنافذة بينهما تُقاس بالثواني لكنها ليست صفراً.
      - name: تطبيق الهجرات
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply naf_marketing --remote

      - name: النشر
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

name = "naf-marketing"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# يخدم هذا الـ Worker واجهة React (assets) بالإضافة إلى الـ API عبر Hono
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# جلسات الدخول الموحّد وكاش مفاتيح المركز والحالة العابرة
# أنشئها بـ: wrangler kv namespace create AUTH_KV
[[kv_namespaces]]
binding = "AUTH_KV"
id = "ضع-المعرّف-العائد-من-الأمر"

# قاعدة بيانات D1
[[d1_databases]]
binding = "DB"
database_name = "naf_marketing"
database_id = "4ab835ee-5c3d-477f-be4b-9def4f49e06a"
migrations_dir = "migrations"

# تخزين الوسائط R2
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "naf-marketing-media"

# المهام المجدولة:
# مشغّل واحد فقط (حساب Cloudflare محدود بـ ٥ مهام cron إجمالاً) — التوقيت يُدار داخل الكود:
#   "*/2 * * * *" كل دقيقتين: مزامنة تعليقات بيسكامب (شبه فوري)، والمهام الساعية عند بداية كل ساعة،
#                 والتقريران الأسبوعي (السبت) والشهري (أول الشهر) عند ١٨:٠٠ UTC ≈ ٢١:٠٠ الرياض.
# النشر لم يعد تلقائياً — يتم يدوياً بالضغط على «نشر الآن»، ومن يفوت موعده يظهر «متأخر».
[triggers]
crons = ["*/2 * * * *"]

# متغيّرات غير سرية (يمكن تعديلها). المفاتيح السرية عبر: wrangler secret put
[vars]
APP_TIMEZONE = "Asia/Riyadh"
APP_NAME = "منصة ناف للتسويق"

# الدخول الموحّد عبر naf-id. هذا القسم وحده هو ما يختلف بين منصة وأخرى.
PLATFORM_ID = "naf-marketing"
AUTH_ISSUER = "https://naf-id.pages.dev"

# مخطّط جدول الأعضاء: المنصة لها users قائم لا members جديد.
MEMBERS_TABLE = "users"
MEMBERS_ID_COLUMN = "id"
MEMBERS_NAME_COLUMN = "name"
MEMBERS_ROLE_COLUMN = "role_name"
MEMBERS_TIME_FORMAT = "iso"
# الصلاحيات الدقيقة في مصفوفة roles_permissions لا في عمود — و`-` تعني: لا عمود.
MEMBERS_PERMS_COLUMN = "-"
# أقلّ الأدوار الثلاثة صلاحية، فأول دخول لا يمنح شيئاً حتى يرقّيه المدير العام.
DEFAULT_ROLE = "writer"

# المفاتيح السرية تُضبط عبر Secrets ولا تُخزَّن هنا:
#   wrangler secret put CLAUDE_API_KEY
#   wrangler secret put PROVIDER_API_KEY
#   wrangler secret put AUTH_CLIENT_SECRET   # سرّ المنصة لدى naf-id

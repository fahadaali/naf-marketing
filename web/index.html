<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` لازم مع شريط الحالة الشفّاف أدناه: بدونه يترك
      النظام شريطاً بلون الخلفية أعلى الشاشة بدل أن تمتدّ الصفحة تحت النتوء.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      لون شريط المتصفّح ونظام التشغيل. الاستثناء الرابع في CLAUDE.md §١:
      الوسم يأخذ قيمةً حرفية ولا يحلّ `var()` فيه متصفّحٌ واحد.

      والقيمتان ليستا مختارتين بالعين: هما `--background` في الوضعين من
      `naf-theme.css` بعد التحويل من oklch إلى sRGB — يطبع الفاتحة
      `scripts/build-app-icons.mjs` عند كل تشغيل، وهي نفسها
      `background_color` في المانيفست. فإن تغيّر جذر الثيم تُحدَّث
      القيمتان معه، ويحرس تطابقهما اختبار `test/themeColor.test.ts`.

      ووسمان لا واحد: بلا استعلام الوسائط يبقى الشريط فاتحاً حول صفحةٍ
      داكنة — حدٌّ أبيض يحيط بالشاشة على الجوال.
    -->
    <meta name="theme-color" content="#e8ebed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c2433" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/brand/naf-mark.svg" />
    
    <!--
      تطبيق الشاشة الرئيسية — الوثيقة في docs/naf-pwa.md.

      الوسمان معاً لا أحدهما: أندرويد يقرأ المانيفست ويتجاهل وسوم apple،
      وآيفون لا يقرأ أيقونات المانيفست إطلاقاً ولا يقرأ إلا `apple-touch-icon`.
      ومانيفستٌ كامل الأيقونات بلا ذلك الوسم يعطي آيفون لقطةً من الصفحة مكان
      الأيقونة — وهي تتغيّر بتغيّر الصفحة التي أُضيف منها.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="التسويق" />

    <title>منصة ناف للتسويق</title>
    <script>
      // تثبيت المظهر قبل أول رسم لتفادي وميض التبديل.
      //
      // غياب المفتاح معناه «يتبع النظام» لا «الوضع الفاتح» — وهو العقد
      // المسجَّل في naf-theme-toggle. كان الافتراض هنا 'light' صراحةً،
      // فقارئٌ نظامه داكن ولم يختر شيئاً يُفتح له الفاتح ثم يقفز إلى
      // الداكن حين يصل المكوّن، وهو الوميض نفسه الذي يمنعه هذا السطر.
      //
      // وسمة data-theme أُسقطت: لم تكن تقرأها ورقة أنماط واحدة، والآلية
      // المسجَّلة صنف .dark على الجذر وحده.
      (function () {
        try {
          var v = localStorage.getItem('naf-theme');
          var dark = v === 'dark' || (v !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

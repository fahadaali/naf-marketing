<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/brand/naf-mark.svg" />
    <title>منصة ناف للتسويق</title>
    <script>
      // تثبيت المظهر قبل الرسم لتفادي وميض التبديل.
      // ثلاث حالات: «يتبع النظام» هو الافتراض حين لا اختيار محفوظ.
      (function () {
        try {
          var choice = localStorage.getItem('naf-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = choice === 'dark' || (choice !== 'light' && systemDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
